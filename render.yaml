# Render Blueprint for the AKSHARA backend (the web app is served by Vercel, which proxies /api here).
#
# One Docker service runs the API and the Celery worker together, because a Render disk attaches to a
# single service and both processes need the blob store. Postgres and Redis are managed by Render.
# Deploy: Render dashboard → New → Blueprint → pick this repository. See docs/DEPLOYMENT.md.
services:
  - type: web
    name: akshara-api # gives https://akshara-api.onrender.com — update frontend/vercel.json if Render picks another name
    runtime: docker
    dockerfilePath: ./infra/docker/api.Dockerfile
    dockerContext: .
    dockerCommand: /usr/local/bin/start-all
    plan: standard # LibreOffice rendering needs more than 512 MB of memory
    healthCheckPath: /api/v1/health
    autoDeploy: true
    disk:
      name: blobs
      mountPath: /data/blobs
      sizeGB: 10
    envVars:
      - key: AKSHARA_ENVIRONMENT
        value: production
      - key: AKSHARA_DATABASE_URL
        fromDatabase:
          name: akshara-db
          property: connectionString
      - key: AKSHARA_REDIS_URL
        fromService:
          type: keyvalue
          name: akshara-redis
          property: connectionString
      - key: AKSHARA_JWT_SECRET
        generateValue: true
      - key: AKSHARA_STORAGE_ROOT
        value: /data/blobs
      - key: AKSHARA_WORKER_CONCURRENCY
        value: "2"
      - key: AKSHARA_REFERENCE_LOOKUPS
        value: "true"
      # Optional — set in the dashboard to enable:
      # AKSHARA_LLM_PROVIDER=anthropic and ANTHROPIC_API_KEY (AI features; users must also opt in)
      # AKSHARA_LANGUAGETOOL_URL (grammar; a LanguageTool server you run)
      - key: AKSHARA_LLM_PROVIDER
        value: none

  - type: keyvalue
    name: akshara-redis
    plan: free
    ipAllowList: [] # reachable only from your Render services

databases:
  - name: akshara-db
    plan: basic-256mb
    databaseName: akshara
    user: akshara
